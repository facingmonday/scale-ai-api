# DigitalOcean App Platform spec (partial).
# Merge static_sites into your existing app spec if API/workers are already defined in the DO console.
name: scale-ai
static_sites:
  - name: web
    source_dir: apps/web
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    github:
      repo: facingmonday/scale-ai-api
      branch: main
      deploy_on_push: true
    envs:
      - key: VITE_API_HOST
        scope: BUILD_TIME
        value: https://api.scalelxp.com
      - key: VITE_CLERK_PUBLISHABLE_KEY
        scope: BUILD_TIME
        type: SECRET
      - key: VITE_HELP_SCOUT_BEACON_ID
        scope: BUILD_TIME
        value: e48e78fe-0bca-41b2-b7fe-276866039818
